  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#1e3a8a" />
    <meta name="description" content="Official Indian Railways Travelling Allowance Journal App" />
    <title>Railway TA Journal</title>
    <link rel="manifest" href="/manifest.json" />

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTML2PDF Library for Direct Download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              devanagari: ['Noto Sans Devanagari', 'sans-serif'],
            },
            screens: {
              'print': {'raw': 'print'},
            }
          }
        }
      }
    </script>
    <style>
      /* --- STRICT PRINT CSS START --- */
      @media print {
        @page {
          size: A4 landscape;
          margin: 0; /* ABSOLUTELY ESSENTIAL: Prevents browser headers/footers */
        }
        
        html, body {
          width: 100%;
          min-height: 100%; 
          margin: 0 !important;
          padding: 0 !important;
          background: white;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }

        /* Hide all UI elements marked no-print */
        .no-print {
          display: none !important;
        }

        /* Hide the root's background styling for print */
        #root {
           background: white;
        }
        
        /* Enforce exact page breaking */
        .page-break {
          page-break-after: always;
          break-after: page;
        }
      }
      /* --- STRICT PRINT CSS END --- */
      
      /* Handwriting Font Simulation */
      .handwriting {
        font-family: 'Courier New', Courier, monospace;
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1; 
      }
      ::-webkit-scrollbar-thumb {
        background: #888; 
        border-radius: 3px;
      }
    </style>
