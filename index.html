    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              devanagari: ['Noto Sans Devanagari', 'sans-serif'],
            },
            screens: {
              'print': {'raw': 'print'},
            }
          }
        }
      }
    </script>
    <style>
      /* Print Specific Styles for Pixel Perfection */
      @media print {
        @page {
          size: A4 landscape;
          margin: 0;
        }
        body {
          print-color-adjust: exact;
          -webkit-print-color-adjust: exact;
          background: white;
        }
        .no-print {
          display: none !important;
        }
        .print-only {
          display: block !important;
        }
        .page-break {
          page-break-after: always;
        }
      }
      .print-only {
        display: none;
      }
      
      /* Handwriting Font Simulation for Inputs */
      .handwriting {
        font-family: 'Courier New', Courier, monospace;
        color: #1a365d; /* Dark Blue pen color */
      }
    </style>
